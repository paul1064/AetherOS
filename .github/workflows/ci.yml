name: CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 2 * * 1'

jobs:
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install flake8 black isort mypy
      
      - name: Run Black formatter check
        run: black --check lib/ agents/ || true
      
      - name: Run isort check
        run: isort --check-only lib/ agents/ || true
      
      - name: Run Flake8 linter
        run: flake8 lib/ agents/ --max-line-length=100 --extend-ignore=E203
      
      - name: Run MyPy type checker
        run: mypy lib/ agents/ --ignore-missing-imports || true

  test:
    name: Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements/core.txt
          pip install pytest pytest-cov
      
      - name: Verify Python syntax
        run: |
          find lib/ agents/ -name "*.py" -exec python -m py_compile {} \;
      
      - name: Run smoke tests
        run: |
          echo "Python version: $(python --version)"
          python -c "import sys; sys.path.insert(0, '.'); print('Imports work')"

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
      
      - name: Check for secrets
        run: |
          echo "Checking for accidentally committed secrets..."
          grep -r "password\s*=\s*['\"][^'\"]" --include="*.py" lib/ agents/ && exit 1 || true

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install build tools
        run: |
          pip install --upgrade pip
          pip install build setuptools wheel
      
      - name: Build distributions
        run: python -m build
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-packages
          path: dist/
